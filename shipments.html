<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出貨單 | 蔬果庫存管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-20 bg-emerald-800 text-white shadow">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:ml-64 lg:max-w-none">
      <div class="flex items-center gap-3">
        <button type="button" class="rounded-lg px-3 py-2 hover:bg-white/10 lg:hidden" onclick="toggleSidebar(true)" aria-label="開啟導覽選單" aria-controls="appSidebar"><i class="fa-solid fa-bars"></i></button>
        <div><h1 class="text-xl font-bold"><i class="fa-solid fa-truck-fast mr-2 text-emerald-200"></i>出貨單</h1><p class="text-xs text-emerald-100">依單據到指定批次與格位取貨，完成後確認出貨</p></div>
      </div>
      <span class="hidden text-sm text-emerald-100 sm:block">生鮮蔬果管理系統</span>
    </div>
  </header>
  <div id="sidebarBackdrop" class="fixed inset-0 z-30 hidden bg-slate-950/40 lg:hidden" onclick="toggleSidebar(false)"></div>
  <aside id="appSidebar" class="fixed bottom-0 left-0 top-16 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white p-4 shadow-xl transition-transform lg:translate-x-0 lg:shadow-none" aria-label="主要導覽">
    <p class="px-3 pb-3 text-xs font-bold uppercase tracking-wider text-slate-400">倉儲管理</p>
    <nav class="space-y-1">
      <a href="/" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i>商品進銷存總覽</a>
      <a href="/warehouse.html" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-warehouse w-5 text-center"></i>倉儲地圖</a>
      <a href="/count.html" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-clipboard-check w-5 text-center"></i>盤點</a>
      <a href="/shipments.html" aria-current="page" class="flex items-center gap-3 rounded-lg bg-emerald-50 px-3 py-3 text-sm font-semibold text-emerald-800"><i class="fa-solid fa-truck-fast w-5 text-center"></i>出貨單</a>
      <a href="/records.html" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i>紀錄查詢</a>
    </nav>
    <div class="mt-6 border-t border-slate-100 pt-4 text-xs leading-5 text-slate-500">待揀貨單會先保留庫存；實際取貨後按「確認揀貨完成」，系統才更新庫存與格位。</div>
  </aside>
  <main class="mx-auto max-w-7xl space-y-5 px-4 py-6 lg:ml-64 lg:mx-0 lg:max-w-none">
    <div id="createdNotice" class="hidden rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-900"><i class="fa-solid fa-circle-check mr-2"></i>出貨單 <strong id="createdOrderNo"></strong> 已建立，請依下方格位資訊取貨；取貨完成後再確認揀貨完成。</div>
    <section class="grid gap-3 sm:grid-cols-3" aria-label="出貨單摘要">
      <article class="rounded-xl border border-amber-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">待揀貨</p><p id="waitingCount" class="mt-1 text-2xl font-bold text-amber-700">—</p></article>
      <article class="rounded-xl border border-emerald-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">已完成</p><p id="completedCount" class="mt-1 text-2xl font-bold text-emerald-700">—</p></article>
      <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">已取消</p><p id="cancelledCount" class="mt-1 text-2xl font-bold text-slate-500">—</p></article>
    </section>
    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-4 py-4">
        <div><h2 class="font-bold">出貨單明細</h2><p class="mt-1 text-xs text-slate-500">待揀貨單已預留庫存，不會被其他出貨或移庫重複使用。</p></div>
        <div class="flex items-center gap-2"><label for="statusFilter" class="sr-only">出貨單狀態</label><select id="statusFilter" class="rounded-lg border border-slate-300 p-2 text-sm"><option value="ALL">全部單據</option><option value="WAITING_PICK">待揀貨</option><option value="COMPLETED">已完成</option><option value="CANCELLED">已取消</option></select><button id="refreshButton" type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50"><i class="fa-solid fa-rotate mr-1"></i>更新</button></div>
      </div>
      <div id="ordersList" class="divide-y divide-slate-100"></div>
      <div id="emptyState" class="hidden p-10 text-center text-sm text-slate-500"><i class="fa-solid fa-clipboard-list mb-2 block text-2xl text-slate-300"></i>目前沒有符合條件的出貨單。</div>
      <div id="loadError" class="hidden p-8 text-center text-sm text-rose-700"></div>
    </section>
  </main>
  <div id="toast" class="fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg" role="status"></div>
  <script src="/navigation.js" defer></script>
  <script src="/shipments.js" defer></script>
</body>
</html>
