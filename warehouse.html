<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>倉儲地圖 | 蔬果庫存管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans TC", sans-serif;
      }
      .map-grid {
        display: grid;
        gap: 0.65rem;
        grid-template-columns: repeat(var(--columns), minmax(100px, 1fr));
      }
      .slot {
        min-height: 112px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="sticky top-0 z-20 bg-emerald-800 text-white shadow">
      <div
        class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:ml-64 lg:max-w-none"
      >
        <div class="flex items-center gap-3">
          <button
            type="button"
            class="rounded-lg px-3 py-2 hover:bg-white/10 lg:hidden"
            onclick="toggleSidebar(true)"
            aria-label="開啟導覽選單"
            aria-controls="appSidebar"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <h1 class="text-xl font-bold">
              <i class="fa-solid fa-warehouse mr-2 text-emerald-200"></i
              >倉儲地圖
            </h1>
            <p class="text-xs text-emerald-100">
              每個格位只放一個批次，同一批次可分放多格
            </p>
          </div>
        </div>
        <span class="hidden text-sm text-emerald-100 sm:block"
          >生鮮蔬果管理系統</span
        >
      </div>
    </header>
    <div
      id="sidebarBackdrop"
      class="fixed inset-0 z-30 hidden bg-slate-950/40 lg:hidden"
      onclick="toggleSidebar(false)"
    ></div>
    <aside
      id="appSidebar"
      class="fixed bottom-0 left-0 top-16 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white p-4 shadow-xl transition-transform lg:translate-x-0 lg:shadow-none"
      aria-label="主要導覽"
    >
      <p
        class="px-3 pb-3 text-xs font-bold uppercase tracking-wider text-slate-400"
      >
        倉儲管理
      </p>
      <nav class="space-y-1">
        <a
          href="/"
          class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"
          ><i class="fa-solid fa-boxes-stacked w-5 text-center"></i
          >商品進銷存總覽</a
        >
        <a
          href="/warehouse.html"
          aria-current="page"
          class="flex items-center gap-3 rounded-lg bg-emerald-50 px-3 py-3 text-sm font-semibold text-emerald-800"
          ><i class="fa-solid fa-warehouse w-5 text-center"></i>倉儲地圖</a
        >
        <a
          href="/count.html"
          class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"
          ><i class="fa-solid fa-clipboard-check w-5 text-center"></i>盤點</a
        >
        <a
          href="/records.html"
          class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"
          ><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i>紀錄查詢</a
        >
      </nav>
      <div
        class="mt-6 border-t border-slate-100 pt-4 text-xs leading-5 text-slate-500"
      >
        從總覽管理商品與庫存；從地圖查看格位、上架與移庫。
      </div>
    </aside>
    <main
      class="mx-auto max-w-7xl space-y-5 px-4 py-6 lg:ml-64 lg:mx-0 lg:max-w-none"
    >
      <section class="grid gap-4 lg:grid-cols-[1fr_2fr]">
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <h2 class="font-bold">選擇倉庫</h2>
          <select
            id="warehouseSelect"
            class="mt-3 w-full rounded-lg border border-slate-300 p-2.5"
            aria-label="選擇倉庫"
          ></select>
          <form id="renameWarehouseForm" class="mt-4 border-t border-slate-100 pt-4">
            <label for="renameWarehouseName" class="block text-xs font-semibold text-slate-600">重新命名目前選取的倉庫</label>
            <div class="mt-2 flex gap-2">
              <input id="renameWarehouseName" maxlength="100" class="min-w-0 flex-1 rounded-lg border border-slate-300 p-2 text-sm" placeholder="輸入新的倉庫名稱" required />
              <button id="renameWarehouseButton" type="submit" class="rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-50">儲存</button>
            </div>
          </form>
          <div class="mt-4 rounded-lg bg-slate-50 p-3 text-sm text-slate-600">
            點選空格可上架尚未定位的批次；先點有貨格位、再點空格可移庫。
          </div>
        </div>
        <form
          id="createWarehouseForm"
          class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"
        >
          <h2 class="font-bold">建立倉庫與第一個區域</h2>
          <div class="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-5">
            <input
              id="warehouseName"
              class="rounded-lg border border-slate-300 p-2 text-sm"
              placeholder="倉庫名稱"
              required
            />
            <input
              id="zoneCode"
              class="rounded-lg border border-slate-300 p-2 text-sm uppercase"
              placeholder="區域代碼，例如 A"
              maxlength="30"
              value="A"
              required
            />
            <label class="text-xs text-slate-500"
              >列數<input
                id="rowCount"
                type="number"
                min="1"
                max="40"
                value="4"
                class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"
                required
            /></label>
            <label class="text-xs text-slate-500"
              >欄數<input
                id="columnCount"
                type="number"
                min="1"
                max="40"
                value="6"
                class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"
                required
            /></label>
            <button
              class="self-end rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-800"
            >
              建立格位
            </button>
          </div>
          <p class="mt-2 text-xs text-slate-500">
            例如 4 列 × 6 欄會建立 24 格；之後可在同一倉庫新增區域，格位代碼如
            A-01-01。
          </p>
        </form>
        <form
          id="createZoneForm"
          class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm lg:col-span-2"
        >
          <h2 class="font-bold">在選取的倉庫新增區域</h2>
          <div class="mt-3 grid gap-2 sm:grid-cols-4">
            <input
              id="newZoneCode"
              class="rounded-lg border border-slate-300 p-2 text-sm uppercase"
              placeholder="區域代碼，例如 B"
              maxlength="30"
              required
            />
            <label class="text-xs text-slate-500"
              >列數<input
                id="newZoneRows"
                type="number"
                min="1"
                max="40"
                value="4"
                class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"
                required
            /></label>
            <label class="text-xs text-slate-500"
              >欄數<input
                id="newZoneColumns"
                type="number"
                min="1"
                max="40"
                value="6"
                class="mt-1 w-full rounded-lg border border-slate-300 p-2 text-sm"
                required
            /></label>
            <button
              class="self-end rounded-lg bg-slate-800 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-900"
            >
              新增區域
            </button>
          </div>
        </form>
      </section>
      <section
        class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"
      >
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 id="mapTitle" class="font-bold">請先建立倉庫格位</h2>
            <p id="mapSummary" class="text-sm text-slate-500"></p>
          </div>
          <div class="flex gap-3 text-xs">
            <span><i class="fa-solid fa-square text-white"></i> 空格</span
            ><span
              ><i class="fa-solid fa-square text-emerald-600"></i> 有庫存</span
            ><span
              ><i class="fa-solid fa-square text-amber-400"></i> 即將到期</span
            >
          </div>
        </div>
        <div id="mapGrid" class="overflow-x-auto"></div>
        <div
          id="mapEmpty"
          class="hidden rounded-lg bg-slate-50 p-8 text-center text-slate-500"
        >
          此倉庫目前沒有格位資料。
        </div>
        <div id="zoneCarousel" class="mt-5 hidden border-t border-slate-100 pt-4">
          <div class="flex items-center justify-between gap-2">
            <button id="previousZone" type="button" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"><i class="fa-solid fa-chevron-left mr-1"></i>上一區</button>
            <div class="min-w-0 flex-1 text-center">
              <p id="activeZoneLabel" class="font-bold text-emerald-800" aria-live="polite"></p>
              <div id="zoneIndicators" class="mt-2 flex flex-wrap justify-center gap-2"></div>
            </div>
            <button id="nextZone" type="button" class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">下一區<i class="fa-solid fa-chevron-right ml-1"></i></button>
          </div>
        </div>
      </section>
    </main>

    <dialog
      id="putawayDialog"
      class="w-[min(92vw,440px)] rounded-2xl p-0 shadow-xl backdrop:bg-slate-900/50"
    >
      <form id="putawayForm" class="space-y-4 p-5">
        <div class="flex items-center justify-between">
          <h2 class="font-bold">上架批次</h2>
          <button
            type="button"
            class="text-xl text-slate-500"
            onclick="closeDialog('putawayDialog')"
            aria-label="關閉"
          >
            ×
          </button>
        </div>
        <p id="putawayLocation" class="text-sm text-slate-500"></p>
        <label class="block text-sm"
          >未上架批次<select
            id="batchSelect"
            class="mt-1 w-full rounded-lg border border-slate-300 p-2"
            required
          ></select
        ></label>
        <label class="block text-sm"
          >上架數量<input
            id="putawayQuantity"
            type="number"
            min="0.01"
            step="0.01"
            class="mt-1 w-full rounded-lg border border-slate-300 p-2"
            required
        /></label>
        <div class="flex justify-end gap-2">
          <button
            type="button"
            class="rounded-lg px-4 py-2 text-sm"
            onclick="closeDialog('putawayDialog')"
          >
            取消</button
          ><button
            class="rounded-lg bg-emerald-700 px-4 py-2 text-sm font-semibold text-white"
          >
            確認上架
          </button>
        </div>
      </form>
    </dialog>
    <div
      id="toast"
      class="fixed bottom-5 right-5 hidden max-w-sm rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-xl"
      role="status"
    ></div>
    <script src="/navigation.js" defer></script>
    <script src="/warehouse.js" defer></script>
  </body>
</html>
