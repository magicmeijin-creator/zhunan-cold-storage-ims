<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>紀錄查詢 | 蔬果庫存管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>body{font-family:'Noto Sans TC',sans-serif}</style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="sticky top-0 z-20 bg-emerald-800 text-white shadow">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:ml-64 lg:max-w-none">
        <div class="flex items-center gap-3">
          <button type="button" class="rounded-lg px-3 py-2 hover:bg-white/10 lg:hidden" onclick="toggleSidebar(true)" aria-label="開啟導覽選單" aria-controls="appSidebar"><i class="fa-solid fa-bars"></i></button>
          <div><h1 class="text-xl font-bold"><i class="fa-solid fa-clock-rotate-left mr-2 text-emerald-200"></i>紀錄查詢</h1><p class="text-xs text-emerald-100">追溯進貨、出貨、報廢、倉位與盤點異動</p></div>
        </div>
        <span class="hidden text-sm text-emerald-100 sm:block">生鮮蔬果管理系統</span>
      </div>
    </header>
    <div id="sidebarBackdrop" class="fixed inset-0 z-30 hidden bg-slate-950/40 lg:hidden" onclick="toggleSidebar(false)"></div>
    <aside id="appSidebar" class="fixed bottom-0 left-0 top-16 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white p-4 shadow-xl transition-transform lg:translate-x-0 lg:shadow-none" aria-label="主要導覽">
      <p class="px-3 pb-3 text-xs font-bold uppercase tracking-wider text-slate-400">倉儲管理</p>
      <nav class="space-y-1">
        <a href="/" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-boxes-stacked w-5 text-center"></i>商品進銷存總覽</a>
        <a href="/warehouse.html" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-warehouse w-5 text-center"></i>倉儲地圖</a>
        <a href="/count.html" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-clipboard-check w-5 text-center"></i>盤點</a>
        <a href="/shipments.html" class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"><i class="fa-solid fa-truck-fast w-5 text-center"></i>出貨單</a>
        <a href="/records.html" aria-current="page" class="flex items-center gap-3 rounded-lg bg-emerald-50 px-3 py-3 text-sm font-semibold text-emerald-800"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i>紀錄查詢</a>
      </nav>
      <div class="mt-6 border-t border-slate-100 pt-4 text-xs leading-5 text-slate-500">依日期、紀錄類型、商品或倉庫區域查找異動。</div>
    </aside>

    <main class="mx-auto max-w-7xl space-y-5 px-4 py-6 lg:ml-64 lg:mx-0 lg:max-w-none">
      <section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4" aria-label="查詢結果摘要">
        <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">進貨紀錄</p><p id="summaryPurchase" class="mt-1 text-2xl font-bold text-emerald-700">—</p></article>
        <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">出貨紀錄</p><p id="summarySale" class="mt-1 text-2xl font-bold text-blue-700">—</p></article>
        <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">報廢紀錄</p><p id="summaryWaste" class="mt-1 text-2xl font-bold text-rose-700">—</p></article>
        <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">倉內異動與盤點調整</p><p id="summaryWarehouse" class="mt-1 text-2xl font-bold text-violet-700">—</p></article>
      </section>

      <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <form id="recordFilterForm" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6">
          <label class="text-xs font-semibold text-slate-600">開始日期<input id="filterFrom" type="date" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-sm font-normal text-slate-800"></label>
          <label class="text-xs font-semibold text-slate-600">結束日期<input id="filterTo" type="date" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-sm font-normal text-slate-800"></label>
          <label class="text-xs font-semibold text-slate-600">紀錄類型<select id="filterType" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-sm font-normal text-slate-800"><option value="ALL">全部類型</option><option value="PURCHASE">進貨</option><option value="SALE">出貨</option><option value="WASTE">報廢</option><option value="RETURN">退貨</option><option value="ADJUSTMENT">盤點調整</option><option value="MOVE">倉位移動</option><option value="PUTAWAY">上架</option><option value="PICK">出庫揀貨</option></select></label>
          <label class="text-xs font-semibold text-slate-600">倉庫<select id="filterWarehouse" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-sm font-normal text-slate-800"><option value="">全部倉庫</option></select></label>
          <label class="text-xs font-semibold text-slate-600">區域<select id="filterZone" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-sm font-normal text-slate-800" disabled><option value="">全部區域</option></select></label>
          <label class="text-xs font-semibold text-slate-600">關鍵字<input id="filterKeyword" type="search" placeholder="商品、批次、單號、格位" class="mt-1 w-full rounded-lg border border-slate-300 p-2.5 text-sm font-normal text-slate-800"></label>
          <div class="flex items-end gap-2 sm:col-span-2 lg:col-span-4 xl:col-span-6">
            <button type="submit" class="rounded-lg bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800"><i class="fa-solid fa-magnifying-glass mr-1"></i>查詢紀錄</button>
            <button id="resetFilters" type="button" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">重設</button>
            <span id="recordCount" class="ml-auto pb-2 text-xs text-slate-500"></span>
          </div>
        </form>
      </section>

      <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-4 py-3"><div><h2 class="font-bold">異動明細</h2><p class="mt-0.5 text-xs text-slate-500">數量依該商品庫存單位顯示；倉位移動不代表庫存總量增減。</p></div><span id="recordStatus" class="text-xs text-slate-500"></span></div>
        <div class="overflow-x-auto">
          <table class="w-full min-w-[1000px] text-left text-sm">
            <thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="px-4 py-3">時間</th><th class="px-4 py-3">類型</th><th class="px-4 py-3">商品／批次</th><th class="px-4 py-3 text-right">數量</th><th class="px-4 py-3">單號</th><th class="px-4 py-3">倉庫／格位</th><th class="px-4 py-3">備註</th></tr></thead>
            <tbody id="recordsBody" class="divide-y divide-slate-100"><tr><td colspan="7" class="px-4 py-12 text-center text-slate-500">設定條件後查詢紀錄。</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/navigation.js" defer></script>
    <script src="/records.js" defer></script>
  </body>
</html>
